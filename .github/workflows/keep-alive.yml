# Keeps the Supabase free-tier project from pausing after 7 idle days.
# Requires repo secret DATABASE_URL (the pooler connection string).

name: keep-alive

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h, UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime deps
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Touch the database
        run: node scripts/db.mjs ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
